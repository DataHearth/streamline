# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Helm E2E

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "deploy/Dockerfile"
      - "deploy/grafana/dashboards/**"
  workflow_dispatch:

concurrency:
  group: helm-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.1

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: streamline-dev

      - name: Build image
        run: |
          task build:js
          task build:css
          task build:oci TAG=dev

      - name: Load image into kind
        run: kind load docker-image ghcr.io/datahearth/streamline:dev --name streamline-dev

      - name: Helm prep + install
        run: |
          mkdir -p /tmp/streamline
          task helm:prep
          task helm:install

      - name: Helm test
        run: task helm:test

      - name: Summary
        if: always()
        run: |
          echo "### Helm E2E" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Kind cluster + helm install + tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Helm E2E failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pods:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -A --no-headers 2>/dev/null || echo "(unavailable)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dump pod logs on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods --all-namespaces | tee /tmp/streamline/pods-describe.log
          kubectl logs -l app.kubernetes.io/instance=streamline --all-containers --tail=200 | tee /tmp/streamline/streamline-logs.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-e2e-failure-logs
          path: |
            /tmp/streamline/pods-describe.log
            /tmp/streamline/streamline-logs.log
          if-no-files-found: ignore
          retention-days: 7

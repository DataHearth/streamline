# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/wiki/ is the source of truth; the wiki repo is a rendered mirror.
      # --delete means a page edited through the wiki UI is overwritten on the
      # next push here — that overwrite is the only thing stopping the two
      # copies from drifting, since GitHub can't make a wiki read-only.
      - name: Push docs/wiki to the wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "docs: sync from ${GITHUB_SHA:0:7}"
          git push
          echo "### Wiki synced" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD~1 HEAD >> "$GITHUB_STEP_SUMMARY"

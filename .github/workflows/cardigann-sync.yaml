# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cardigann sync

# Re-syncs the embedded tracker definitions from Prowlarr/Indexers and opens
# (or refreshes) one pull request with the result. The diff is exactly what
# upstream changed since the last sync, converted by the converter on main.
#
# A pull request opened with the Actions token starts no workflow of its own,
# so CI does not run on it until someone pushes to the branch. This job runs
# the cardigann suites itself before opening it — they re-check every
# definition in the snapshot — and says so in the body.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Prowlarr/Indexers branch, tag or commit
        default: master

concurrency:
  group: cardigann-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: cardigann/sync
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync
        env:
          REF: ${{ inputs.ref || 'master' }}
        run: task cardigann:sync REF="$REF"

      - name: Changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- internal/cardigann/definitions)" ]; then
            echo "Snapshot already matches upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          index=internal/cardigann/definitions/index.json
          commit=$(jq -r .upstream.commit "$index")
          {
            echo "changed=true"
            echo "commit=$commit"
            echo "short=${commit:0:7}"
            echo "count=$(jq '.definitions | length' "$index")"
            echo "skipped=$(jq '.skipped | length' "$index")"
          } >> "$GITHUB_OUTPUT"

      - name: Test the snapshot
        if: steps.changes.outputs.changed == 'true'
        run: task test:unit -- ./internal/cardigann/...

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.changes.outputs.commit }}
          SHORT: ${{ steps.changes.outputs.short }}
          COUNT: ${{ steps.changes.outputs.count }}
          SKIPPED: ${{ steps.changes.outputs.skipped }}
        run: |
          set -euo pipefail
          title="chore(cardigann): sync definitions to ${SHORT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add internal/cardigann/definitions
          git commit -m "$title"
          # One branch, rewritten each run: an unmerged sync is superseded by
          # the next one, which already contains it.
          git push --force origin "$BRANCH"

          skipped=$(jq -r '.skipped[] | "- `\(.file)`: \(.reason)"' \
            internal/cardigann/definitions/index.json)
          body=$(cat <<EOF
          ## What

          Re-syncs the embedded tracker definitions from Prowlarr/Indexers [\`${SHORT}\`](https://github.com/Prowlarr/Indexers/commit/${COMMIT}): ${COUNT} converted, ${SKIPPED} skipped.

          Generated by \`task cardigann:sync\` from the scheduled workflow; nothing here is hand-edited.

          ${skipped:+Skipped:}
          ${skipped}

          ## Checklist

          - [x] The cardigann suites passed in the workflow run (round trip and \`convert.Check\` over every definition)
          - [ ] CI has run: a pull request opened with the Actions token starts none, so push to the branch (or close and reopen) to run it
          EOF
          )

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi

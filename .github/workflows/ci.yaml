# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches: [main]

# No concurrency group: a run is never cancelled or replaced by a newer one.
# Each run tests only the sections its own diff touches, so a superseded run
# is the only one that ever tests what its commit changed; on main a pending
# run replaced by the next push would leave that push untested for good.

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  # One diff, read once, decides which sections run. A job whose section is
  # untouched is skipped at the job level. A push to main is filtered against
  # the commit it replaced, like a PR against its base. `ci-ok` at the end is
  # the one check branch protection requires.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      biome: ${{ steps.filter.outputs.biome }}
      helm: ${{ steps.filter.outputs.helm }}
      chart: ${{ steps.filter.outputs.chart }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed sections
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Each list is everything its jobs read, the task files and this
          # workflow included, so a change to how a section runs runs it.
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'ent/**'
              - 'internal/**'
              - 'extensions/**'
              - 'cmd/**'
              - 'e2e/**'
              - '.golangci.yml'
              - '.mockery.yaml'
              - 'Taskfile.yaml'
              - '.taskfiles/build.yaml'
              - '.taskfiles/lint.yaml'
              - '.taskfiles/test.yaml'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'routify.config.js'
              - 'biome.json'
              - 'Taskfile.yaml'
              - '.taskfiles/build.yaml'
              - '.taskfiles/lint.yaml'
              - '.github/workflows/ci.yaml'
            biome:
              - 'web/app/**'
              - 'web/static/js/**'
              - 'web/static/css/**'
              - 'biome.json'
              - 'Taskfile.yaml'
              - '.taskfiles/lint.yaml'
              - '.github/workflows/ci.yaml'
            helm:
              - 'deploy/helm/**'
              - 'deploy/grafana/dashboards/**'
              - '.taskfiles/helm.yaml'
              - '.github/workflows/ci.yaml'
            # What ships in the chart tarball, and so what needs a version
            # bump: a change to how the chart is linted is not one.
            chart:
              - 'deploy/helm/**'
              - 'deploy/grafana/dashboards/**'
            # The flake checks build the package, both NixOS VM tests and the
            # home-manager activation — twenty minutes of runner when it has
            # to run. This is every input those outputs hash over: a pnpm-lock
            # or go.sum change moves pnpmDeps/vendorHash, and a stale hash only
            # ever shows up here.
            nix:
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yaml'

  # Three stages, each waiting on the one before: vulncheck, then the lints
  # and the build, then test and nix. A failure in a stage skips every later
  # one. A stage's job skipped by its own filter does not: each later job's
  # `if` names `!failure()`, which replaces the default "every need
  # succeeded" and is true whenever no job before it failed.
  #
  # Advisories land without any change here, so main is scanned on every push.
  vulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Scan dependencies
        run: task vulncheck
      - name: Summary
        if: always()
        run: |
          echo "### Vulnerability Scan" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ govulncheck found no reachable vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ govulncheck reported vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-go:
    needs: [changes, vulncheck]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Lint Go
        run: task lint:go
      - name: Summary
        if: always()
        run: |
          echo "### Go Lint" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ golangci-lint passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ golangci-lint found issues" >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-frontend:
    needs: [changes, vulncheck]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.biome == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The version biome.json's $schema names, so a new Biome release never
      # fails a PR that only happens to touch static JS/CSS.
      - name: Read Biome version
        id: biome
        run: |
          v=$(jq -r '."$schema"' biome.json | sed -n 's|.*/schemas/\([0-9][0-9.]*\)/schema\.json$|\1|p')
          [ -n "$v" ] || { echo "::error file=biome.json::no version in \$schema"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: ${{ steps.biome.outputs.version }}
      - name: Lint frontend
        run: task lint:frontend
      - name: Summary
        if: always()
        run: |
          echo "### Frontend Lint" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Biome passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Lint issues — run \`task lint:frontend\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # esbuild strips types without checking them and Biome does not type-check,
  # so this is the only job that catches a type error in web/app.
  lint-ts:
    needs: [changes, vulncheck]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck the SPA
        # lint:ts depends on build:js, which generates the Paraglide messages
        # and Routify's route tree the components import.
        run: task lint:ts -- --fail-on-warnings
      - name: Summary
        if: always()
        run: |
          echo "### Frontend Typecheck" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ svelte-check passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ svelte-check found problems — run \`task lint:ts\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-helm:
    needs: [changes, vulncheck]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A published chart version is immutable in practice — re-pushing it
      # silently swaps the artifact under everyone who pinned it. Touch the
      # chart, bump the chart.
      - name: Chart version must be bumped
        if: needs.changes.outputs.chart == 'true' && github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${GITHUB_BASE_REF}"
          chart=deploy/helm/streamline/Chart.yaml
          read_version() { sed -n 's/^version: *//p'; }
          head_v=$(read_version < "$chart")
          base_v=$(git show "origin/${GITHUB_BASE_REF}:${chart}" | read_version)

          if [ "$head_v" = "$base_v" ]; then
            echo "::error file=${chart}::chart changed but version is still ${head_v} — bump it"
            exit 1
          fi
          # sort -V so 0.10.0 > 0.9.0; a backwards bump is as broken as none.
          newest=$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)
          if [ "$newest" != "$head_v" ]; then
            echo "::error file=${chart}::version went backwards: ${base_v} -> ${head_v}"
            exit 1
          fi
          echo "chart version ${base_v} -> ${head_v}"

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Helm prep + lint
        run: |
          mkdir -p /tmp/streamline
          task helm:lint

      - name: Helm template (default + observability)
        run: task helm:template

      - name: Summary
        if: always()
        run: |
          echo "### Helm" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Helm lint + template passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Helm validation failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: [changes, vulncheck]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build binary + assets
        run: task build:app
      - name: Build extensions
        run: task build:extensions
      # Skipped once any entry for this go.sum exists: the test job's covers
      # this one's. The explicit go.sum paths keep node_modules out of the
      # hash, which a `**` glob would read after the pnpm install.
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' && steps.go-cache.outputs.cache-matched-key != format('go-{0}-{1}-build-{2}', runner.os, steps.go.outputs.go-version, hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
      - name: Summary
        if: always()
        run: |
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Binary + frontend assets compiled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A frontend-only change runs what reads the SPA: the web e2e specs, which
  # drive it in a browser, and the unit specs over the embedded assets
  # (internal/server/web, the one test package importing `web`). Only a Go
  # change needs the whole tree.
  test:
    needs: [changes, lint-go, lint-frontend, lint-ts, lint-helm, build]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-${{ hashFiles('go.sum', 'extensions/**/go.sum', 'internal/extension/testdata/**/go.sum') }}
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-test-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-build-
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend assets
        run: task build:js build:css
      # e2e/web skips its whole suite, green, when CHROME_PATH is unset; the
      # runner image ships Google Chrome, and its absence fails here instead.
      - name: Locate Chrome
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          [ -n "$chrome" ] || { echo "::error::no Chrome on the runner, so e2e/web would skip"; exit 1; }
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      # The ffmpeg and transcoding e2e specs run the real encoder and skip
      # without it on PATH; Ubuntu's build carries libx264, libx265, libmp3lame
      # and libopus, which they use.
      - name: Install ffmpeg
        if: needs.changes.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      # STREAMLINE_E2E_CONTAINERS lets the container-backed specs (qBittorrent,
      # Prowlarr) start their images on the runner's Docker instead of
      # skipping, so `task test` runs every spec.
      - name: Run tests
        if: needs.changes.outputs.go == 'true'
        env:
          STREAMLINE_E2E_CONTAINERS: "1"
        run: task test JUNIT_DIR=/tmp/streamline -- --keep-going
      # An entry is never rewritten once saved, so the Go cache has two per
      # go.sum: this one, with every module and every test binary, which is
      # what each job asks for first, and the build job's, saved a stage
      # earlier, which is there when the tests on main fail. Only on main,
      # whose caches every PR can read, and only after the whole tree ran.
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.go == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Run frontend tests
        if: needs.changes.outputs.go != 'true'
        # CLI_ARGS replaces each task's package list. Both run whatever the
        # first one does, so one report covers everything. test:e2e's timeout
        # counts the build: on a 4-vCPU runner the web suite takes about 28s
        # from a warm Go build cache and about 2m from a cold one (some 25s
        # of it specs), past the 1m15s local default.
        run: |
          status=0
          task test:e2e E2E_TIMEOUT=4m -- --junit-report=/tmp/streamline/junit-e2e.xml ./e2e/web || status=1
          task test:unit -- --junit-report=/tmp/streamline/junit-rest.xml ./internal/server/web || status=1
          exit "$status"
      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: /tmp/streamline/junit-*.xml
          check_name: Test Results
          detailed_summary: true
          fail_on_failure: false

  nix:
    needs: [changes, lint-go, lint-frontend, lint-ts, lint-helm, build]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # `nix copy --no-check-sigs` below needs the runner to be trusted.
          extra_nix_config: trusted-users = root runner

      - name: Remote builder
        uses: ./.github/actions/nix-builder
        with:
          ssh-key: ${{ secrets.NIX_BUILDER_SSH_KEY }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}

      # Everything `nix flake check` evaluates, without building any of it.
      - name: Evaluate the flake
        run: nix flake check --no-build

      # The builder's `ci` account is not a trusted user: it can have the
      # daemon build what it sends (`--store`), not act as a remote builder.
      # The package is copied back so the VM test does not build it again.
      - name: Package, lint and home-manager
        run: |
          set -euo pipefail
          checks=(.#checks.x86_64-linux.build .#checks.x86_64-linux.home-manager .#checks.x86_64-linux.lint)
          if [ -n "${NIX_BUILDER_STORE:-}" ]; then
            nix build --no-link --print-build-logs --store "$NIX_BUILDER_STORE" --eval-store auto "${checks[@]}"
            nix copy --no-check-sigs --from "$NIX_BUILDER_STORE" .#checks.x86_64-linux.build
          else
            nix build --no-link --print-build-logs "${checks[@]}"
          fi

      # Needs KVM, which the builder does not have.
      - name: NixOS VM test
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.nixos

      - name: Summary
        if: always()
        run: |
          echo "### Nix" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Package, lint, NixOS VM test and home-manager module all built" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ nix checks failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The one check branch protection should require. A job skipped by its `if`
  # reads as passing, and so does every job when `changes` itself fails (they
  # are skipped for want of its outputs), so the per-job checks alone would
  # let a broken filter through green. This fails unless `changes` succeeded
  # and every section either passed or was skipped.
  ci-ok:
    if: always()
    needs: [changes, lint-go, vulncheck, lint-frontend, lint-ts, test, build, lint-helm, nix]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every section passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES; jobs: $RESULTS"
          [ "$CHANGES" = success ] || { echo "::error::the changes job did not succeed"; exit 1; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job ended $r"; exit 1 ;;
            esac
          done

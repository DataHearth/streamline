name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Check [the roadmap](https://github.com/datahearth/streamline/blob/main/docs/ROADMAP.md)
        first — music, books and the player are already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
      description: Including how the *arr stack or Seerr handles it, if relevant.

name: Feature request
description: Suggest something new
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: >
        Check [the roadmap](https://github.com/datahearth/streamline/wiki/Roadmap)
        first — the built-in player is already planned, and music and books have shipped.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
      description: Including how the *arr stack or Seerr handles it, if relevant.

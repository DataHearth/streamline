# Every label the repository carries, and the one list both workflows read:
# labels.yaml syncs it to GitHub, issue-triage.yaml derives what Claude may
# touch from `group`.
#
#   type, area  — Claude adds and removes these, on new issues and on a backfill
#   status      — Claude adds these on new issues only, never on a backfill
#   maintainer  — a person's call; Claude never adds or removes one
#   renovate    — set by renovate.json on its own PRs
#
# A description is also Claude's guidance for when the label fits, so it says
# what the label covers rather than restating its name. GitHub caps it at 100
# characters. `aliases` are old names the sync renames in place, keeping the
# label on every issue that already has it. The sync never deletes a label.

# Type
- name: bug
  group: type
  color: d73a4a
  description: Something isn't working
- name: enhancement
  group: type
  color: a2eeef
  description: New feature or request
- name: documentation
  group: type
  color: 0075ca
  description: The wiki, README or other docs are wrong, missing or unclear

# Status
- name: needs-triage
  group: status
  color: fbca04
  description: Not triaged yet; still here after the triage run means the run failed
- name: needs-info
  group: status
  color: d876e3
  description: The report is missing what it takes to act on it
  aliases: [question]
- name: possible-duplicate
  group: status
  color: cfd3d7
  description: Looks like an existing issue; a maintainer confirms with `duplicate`
- name: security
  group: status
  color: b60205
  description: A vulnerability or hardening concern


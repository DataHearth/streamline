# Maintainer
- name: duplicate
  group: maintainer
  color: cfd3d7
  description: This issue or pull request already exists
- name: help wanted
  group: maintainer
  color: "008672"
  description: Extra attention is needed
- name: good first issue
  group: maintainer
  color: 7057ff
  description: Good for newcomers
- name: invalid
  group: maintainer
  color: e4e669
  description: This doesn't seem right
- name: wontfix
  group: maintainer

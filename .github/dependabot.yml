# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

# Workflow actions are pinned to commit SHAs so a repointed tag cannot inject
# code into the release jobs that hold id-token/packages write. A SHA never
# moves, so nothing here picks up upstream security fixes on its own —
# Dependabot is what keeps the pins current. It rewrites both the SHA and the
# trailing `# vX.Y.Z` comment, so the comment stays truthful.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

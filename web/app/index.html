<!doctype html>
<html lang="en" class="h-full" style="color-scheme: dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Streamline</title>
		<link rel="icon" type="image/png" href="/static/images/favicon-512.png" />
		<link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png" />
		<link rel="manifest" href="/static/manifest.json" />
		<meta name="theme-color" content="#0b0b10" />
		<!-- Installed to an iOS home screen, the page runs under a transparent status
		     bar with white text instead of below a light band in light mode. Every
		     layer pinned to the top pads env(safe-area-inset-top) for it. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- The style above has no effect on an iOS version that reads the tags
		     below as the switch for home-screen mode rather than the manifest. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="preload" href="/static/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/static/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/static/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/static/css/style.css" />
		<link rel="stylesheet" href="/static/dist/spa.min.css" />
	</head>
	<body class="h-full bg-bg-deep text-fg antialiased">
		<div id="app"></div>
		<script type="module" src="/static/dist/spa.min.js"></script>
	</body>
</html>

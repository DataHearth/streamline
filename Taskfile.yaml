# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BINARY: streamline
  LABEL_FILTER: '{{.LABEL_FILTER}}'

# Split by namespace: a file per include, task names unchanged (`build:go`
# lives in .taskfiles/build.yaml as `go`). Inside an included file a bare name
# resolves within its own namespace; a leading colon reaches the global one,
# which is how e.g. lint:go depends on `:build:js`.
includes:
  build: ./.taskfiles/build.yaml
  test: ./.taskfiles/test.yaml
  lint: ./.taskfiles/lint.yaml
  helm: ./.taskfiles/helm.yaml
  release: ./.taskfiles/release.yaml

tasks:
  default:
    desc: Build everything
    deps: [build:app]

  # What follows owns no namespace of its own — everything else lives in an
  # include above.

  dev:
    desc: Run with live reload via air
    cmd: go tool air
    interactive: true

  vulncheck:
    desc: Scan dependencies for known vulnerabilities
    # Same //go:embed constraint as lint:go — govulncheck loads the packages.
    deps: [build:js, build:css]
    cmd: go tool govulncheck ./...

  fmt:
    desc: Format all code
    cmds:
      - go tool golangci-lint fmt ./...
      - biome format --write web/static/js web/static/css
      - nixfmt flake.nix nix/*.nix

  fmt:check:
    desc: Check formatting without writing
    cmds:
      - biome format web/static/js web/static/css
      - nixfmt --check flake.nix nix/*.nix

  docs:screenshots:
    desc: Retake the README screenshots in docs/assets from the demo library (-- -record to refresh its cassette with real provider keys)
    # e2e/demo boots a throwaway instance on the binary built here, seeds the
    # demo library through its API and shoots every page. The providers answer
    # from e2e/demo/cassette, fetched from the demo-cassette branch when it is
    # not on disk; -record fills what it lacks from the real ones
    # (STREAMLINE_METADATA__{TMDB,TVDB,HARDCOVER}_API_KEY). Needs ffmpeg and a
    # Chromium (CHROME_PATH, on PATH, or Playwright's).
    vars:
      DEMO_BIN: '{{.ROOT_DIR}}/tmp/streamline-demo'
    cmds:
      - task: docs:cassette:fetch
      # build:go, not its build:app alias: a dep does not forward the vars of
      # the call, so the alias would build ./streamline and leave DEMO_BIN
      # unwritten. build:go is the task that reads BINARY (and builds js+css).
      - task: build:go
        vars: {BINARY: '{{.DEMO_BIN}}'}
      - go run ./e2e/demo -binary {{.DEMO_BIN}} {{.CLI_ARGS}}

  # The cassette lives on an orphan branch, not in main's history: its images
  # are megabytes no build needs, and every re-recording would add to them.
  docs:cassette:fetch:
    desc: Fetch the demo cassette from its orphan branch into e2e/demo/cassette (skipped when one is there)
    vars: &cassette
      CASSETTE_REMOTE: '{{.CASSETTE_REMOTE | default "origin"}}'
      CASSETTE_BRANCH: '{{.CASSETTE_BRANCH | default "demo-cassette"}}'
    status:
      - test -f e2e/demo/cassette/cassette.json
    cmds:
      - |
        if git fetch --depth=1 {{.CASSETTE_REMOTE}} {{.CASSETTE_BRANCH}}; then
          mkdir -p e2e/demo/cassette
          git archive FETCH_HEAD | tar -x -C e2e/demo/cassette
        else
          echo "no {{.CASSETTE_BRANCH}} branch on {{.CASSETTE_REMOTE}}: record one with 'task docs:screenshots -- -record' and the provider keys"
        fi

  docs:cassette:publish:
    desc: Replace the demo-cassette branch with e2e/demo/cassette, as one commit with no history
    vars: *cassette
    preconditions:
      - sh: test -f e2e/demo/cassette/cassette.json
        msg: e2e/demo/cassette holds no recording
    # Plumbing, so neither the working copy nor its index is touched. One
    # parentless commit replaces the last: the branch never grows a history
    # of superseded images.
    cmd: |
      set -eu
      idx=$(mktemp); rm -f "$idx"; trap 'rm -f "$idx"' EXIT
      GIT_INDEX_FILE=$idx git --work-tree=e2e/demo/cassette add -A -f .
      tree=$(GIT_INDEX_FILE=$idx git write-tree)
      commit=$(git commit-tree "$tree" -m "chore(demo): the demo library's provider cassette")
      git push --force {{.CASSETTE_REMOTE}} "$commit:refs/heads/{{.CASSETTE_BRANCH}}"

  migrate:diff:
    desc: Generate a new versioned migration from the ent schema (usage - task migrate:diff -- NAME)
    cmd: go run -mod=mod ./ent/migrate/main.go {{.CLI_ARGS}}

  migrate:check:
    desc: Check every down migration restores the schema before it, replacing any that does not
    cmd: go run -mod=mod ./ent/migrate/main.go -check-history

  generate:
    desc: Regenerate all generated code
    cmds:
      - go tool oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
      - go generate ./ent
      - go tool mockery
    sources:
      - api/openapi.yaml
      - api/oapi-codegen.yaml
      - ent/schema/*.go
      - .mockery.yaml
      - internal/**/*.go
      - exclude: "**/*_test.go"
      - exclude: "**/mocks/**"
    generates:
      - internal/server/restapi/gen.go
      - ent/**/*.go
      - exclude: ent/schema/*.go

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -f web/static/js/docs.min.js
      - rm -f web/static/css/style.css
      - rm -f web/static/css/docs.min.css
      - rm -rf web/static/dist


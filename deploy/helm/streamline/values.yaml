# Container image for streamline.
image:
  repository: ghcr.io/datahearth/streamline
  tag: "" # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
imagePullSecrets: []

# SQLite is a single writer. Multiple replicas are not supported.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Streamline talks to no Kubernetes API — mounting the token would only
  # hand a credential to an SSRF or RCE.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
# Image runs as non-root uid/gid 1000. fsGroup makes a root-owned RWO PVC
# (e.g. ceph-block) group-writable so SQLite can open /data — without it the
# pod crashloops on "unable to open database file (14)".
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
# readOnlyRootFilesystem holds only as long as every path the app writes to is a
# mount — it is a property of your values, not of the chart, because the paths
# are yours to set. The mounts are /data (PVC), the library volumes, and /tmp
# (64Mi emptyDir, for sqlite temp spills only).
#
# The chart refuses to render rather than let a bad path crashloop, but that
# check reaches EXACTLY as far as the `config:` block below and no further.
#
# CHECKED — the chart fails the render if any of these is not under a mount:
#   * config.data_dir            — the app mkdirs <data_dir>/posters
#   * config.library.movie_path, config.library.series_path
#   * config.download_clients[].download_dir, for an ENABLED builtin client
#     (client_type: builtin) — it mkdirs <download_dir>/.streamline-session
#     before the library roots, so it is the first thing to fail. Note the
#     networkPolicy block below tells you to declare that entry for its peer
#     port; declaring it does NOT mount its download_dir.
#   * config.log.app.output, config.log.http.output, when absolute. These fail
#     SILENTLY at runtime rather than loudly — the log file is opened lazily and
#     the error is discarded, so the pod looks healthy and emits nothing — which
#     is why the chart stops them at render time. A relative value resolves
#     under data_dir, so it is covered by the data_dir check.
# Pointing any of the above at /tmp is rejected too: /tmp IS a mount, but it is
# capped at 64Mi and wiped on restart, so the kubelet evicts the pod once the
# database, poster cache or rotated logs breach sizeLimit.
#
# NOT CHECKED — these render clean and can still kill the pod:
#   * anything you inject through extraEnv or secrets. koanf applies STREAMLINE_*
#     env AFTER the config file, so env WINS over everything the chart renders
#     into the ConfigMap, and the chart cannot see the value it lost to. e.g.
#     `extraEnv: [{name: STREAMLINE_LIBRARY__MOVIE_PATH, value: /var/movies}]`
#     renders fine and the pod dies on "mkdir /var/movies: read-only file
#     system". If you redirect a path with env, you own checking it is mounted.
#   * config.data_dir pointing at a SUBDIRECTORY of a mount — see the note on
#     config.data_dir below. That one fails for an unrelated reason and fails
#     with readOnlyRootFilesystem: false just the same.
#
# Two ways to trip the checked set without touching config at all:
#   * persistence.enabled: false while config.data_dir still points at /data,
#     which is then a plain directory in the image.
#   * library.shared.enabled: false with neither library.media nor
#     library.downloads on, which drops config.library.{movie,series}_path back
#     to the binary defaults /media/movies and /media/series.
# Fix either by pointing the path at a persistent volume that IS mounted, or by
# setting readOnlyRootFilesystem: false to opt out. Setting this whole block to
# null also opts out — it drops the container securityContext entirely. `{}`
# does NOT: Helm coalesces your map over the chart's, so the values below
# survive an empty override and readOnlyRootFilesystem stays true.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  size: 5Gi
  storageClass: "" # empty = cluster default
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 8080

# Off by default: a NetworkPolicy is only enforced if the CNI implements it, and
# on a cluster that does, a wrong rule fails as a silent timeout rather than an
# error. Opt in, then check the pod can still reach its indexers.
#
# With observability.enabled, helm prints two `coalesce.go ... alloy.networkPolicy
# is a table` warnings — a key-name collision with the upstream alloy chart's own
# networkPolicy values. Cosmetic: alloy's manifests render byte-identical either way.
networkPolicy:
  enabled: false
  ingress:
    # NetworkPolicyPeer list allowed to reach service.port. Empty = any source,
    # which still narrows the pod to that one port. Restrict it to the ingress
    # controller once you know its namespace, e.g.
    #   from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
    #
    # TRAP: the ingress controller is not the only thing that opens this port,
    # and the other two are easy to forget because neither is an app client:
    #   * the kubelet's liveness/readiness httpGet on the SAME port. Its source
    #     is the NODE IP, not a pod, so no namespaceSelector/podSelector matches
    #     it. Whether a namespace-only `from` still admits it is CNI-dependent —
    #     Calico ships a "failsafe" for host traffic, Cilium needs
    #     `- toEntities: [host]`-equivalent ingress (`fromEntities: [host]`) in a
    #     CiliumNetworkPolicy. Get it wrong and probes fail, the pod is marked
    #     NotReady and restarted: a crashloop that looks like an app bug.
    #   * the `helm test` pod (templates/tests/test-health.yaml), which curls
    #     http://<release>:8080/health from the SAME namespace. A `from` naming
    #     only the ingress namespace makes `helm test` hang and fail.
    # Add an explicit peer for each rather than assuming they are exempt, e.g.
    #   from:
    #     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
    #     - podSelector: {}            # same-namespace, covers `helm test`
    #     - ipBlock: { cidr: <node-cidr> }   # kubelet probes, if your CNI needs it
    #
    # This gates the HTTP port ONLY. A builtin download client
    # (config.download_clients[].client_type: builtin) also needs its peer port
    # reachable from the whole internet — the chart opens TCP+UDP on that
    # entry's listen_port (42069 when unset) as its own unrestricted rule, so
    # tightening `from` here can't strand the torrent client. Peer traffic
    # needs the same port published at the edge (hostPort/LoadBalancer/port
    # forward); a NetworkPolicy only stops dropping it, it does not route it.
    from: []
  egress:
    # Separate switch: streamline dials indexers, trackers, download clients,
    # media servers and metadata APIs, so an allowlist that misses one breaks
    # grabs in ways that look like an upstream outage.
    #
    # DNS to the kube-system namespace is always allowed when this is on.
    # That is NOT the same as "DNS always works": NodeLocal DNSCache serves
    # from a hostNetwork DaemonSet on a link-local VIP, and hostNetwork pods
    # are not reliably matched by a namespaceSelector. See nodeLocalDNS below.
    enabled: false
    # Everything else outbound over IPv4 and IPv6, minus the cloud
    # instance-metadata endpoints (169.254.169.254, fd00:ec2::254) that an SSRF
    # would mine for credentials. Turn it off and list destinations explicitly
    # in `to` below.
    #
    # TRAP (Cilium): an ipBlock CIDR resolves to the `world` identity, which
    # does not cover in-cluster endpoints. With allowExternal on but no matching
    # rule in `to`, egress to a qBittorrent/Plex/indexer pod in ANOTHER
    # namespace is still denied — it never leaves the cluster, so `world` never
    # matches. Calico and the reference CNI do match pod IPs against ipBlock.
    # Add an explicit namespaceSelector/podSelector rule in `to` either way.
    allowExternal: true
    # CIDRs allowed on port 53 on top of the kube-system rule. Needed when the
    # cluster runs NodeLocal DNSCache, whose hostNetwork pods answer on a
    # link-local VIP: 169.254.20.10 upstream, 169.254.25.10 on kubespray.
    # `kubectl -n kube-system get cm nodelocaldns -o yaml` shows the address in
    # use. Leaving this empty on such a cluster is the silent-timeout failure
    # this whole block warns about.
    #
    # TRAP (Cilium): this knob does NOT fix that failure on Cilium. The cache
    # answers from a hostNetwork DaemonSet, and Cilium classifies anything
    # destined for the node itself as the reserved `host` identity — which
    # ipBlock/CIDR rules never match, however exactly the CIDR is written. The
    # rule renders, kubeconform passes, and DNS still times out silently: the
    # very mode this knob exists to prevent. On Cilium you need a
    # CiliumNetworkPolicy with `toEntities: [host]` instead (apply it alongside
    # via extraManifests/kustomize; a v1 NetworkPolicy cannot express it).
    # Calico and the reference CNI do match the VIP against ipBlock, so this
    # knob is sufficient there.
    nodeLocalDNS: [] # e.g. [169.254.20.10/32]
    # Extra egress RULES (not bare peers), appended verbatim, e.g.
    #   to: [{ to: [{ podSelector: { matchLabels: { app: qbittorrent } } }] }]
    to: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: [] # [{ host: streamline.example.com, paths: [{ path: /, pathType: Prefix }] }]
  tls: [] # [{ secretName: streamline-tls, hosts: [streamline.example.com] }]

gateway:
  enabled: false
  parentRefs: [] # [{ name: my-gateway, namespace: gateway-system }]
  hostnames: [] # [streamline.example.com]

# Rendered into /etc/streamline/config.yaml (koanf file source). Only keys that
# DEVIATE from the binary's built-in defaults belong here — the binary owns the
# rest, so this can't silently drift from them. Override any other key by adding
# it; koanf merges this file over defaults. See `streamline config validate`.
config:
  # Binary default ./data is relative; MUST pin to the PVC mount.
  #
  # TRAP: keep this AT the mount, not in a subdirectory of it. data_dir is
  # validated with `required,dir`, which demands the directory ALREADY EXIST at
  # config load — and nothing creates it (posters mkdirs <data_dir>/posters, but
  # only long after validation has run). A freshly provisioned PVC is empty, so
  # `data_dir: /data/streamline` renders clean, passes the writable-path check
  # above, and then the pod exits at startup with
  #   Field validation for 'DataDir' failed on the 'dir' tag
  # This has nothing to do with readOnlyRootFilesystem — it fails identically
  # with a fully writable root filesystem — so the writable-path guard is the
  # wrong place to catch it and deliberately does not try. Keep data_dir at the
  # mount root and let the app lay out its own files under it — this chart
  # exposes no initContainer hook and no subPath knob, so pre-creating the
  # subdirectory would mean patching the rendered manifest yourself.
  data_dir: /data
  # Declarative deploy: the app never writes config back (config.Update returns
  # ErrReadOnly). Change config through git, not the UI. Runtime-only values
  # (session_secret, plex_client_id) must be supplied here or via secretFiles.
  read_only: true # binary default false
  server:
    port: 8080 # MUST match service.port — probes + containerPort target it
  log:
    app:
      format: json # binary default text; deploy wants structured logs
  otel:
    endpoint: "" # auto-set to the subchart alloy service when observability.enabled=true
  # Single sign-on. How far a provider is trusted is two separate questions,
  # one key each, both defaulting closed.
  #
  # auth.oidc[].email_linking — which existing accounts it may ADOPT, i.e. sign
  # in as because the email addresses match:
  #   disabled (default) — none.
  #   non_admin — non-admin accounts only. This is the migration setting: turn
  #     it on, have each user sign in once to bind their identity, turn it off.
  #   all — any account, admin included.
  # It gates the adoption only. The identity an adoption links stays linked, and
  # later logins match on it without reading this key, so a provider set back to
  # disabled keeps signing in as every account it adopted while it was open.
  # There is no unlink: deleting the user is what drops the identity.
  #
  # auth.oidc[].allow_admin — whether it may put an account on the admin ROLE:
  #   false (default) — no login through this provider ever yields admin, with
  #     no exception: not a claim mapped to admin by role_mapping, not an
  #     auth.oidc_default_role of admin, not the role an invite carries. A
  #     per-request check would not do: the attacker chooses which groups each
  #     login carries, so they present a harmless one first and the admin group
  #     after the link exists.
  #   true — the provider decides who administers Streamline.
  #
  # The keys are independent on purpose. While one key meant both, tightening
  # the adoption tier could RAISE the role ceiling — an account of federated
  # origin adopted at non_admin became promotable the moment the operator set
  # the provider back to disabled.
  #
  # Names must be unique: the pod refuses to start on a duplicate rather than
  # let one entry's issuer validate the token while another entry's allow_admin
  # bounds it. A templating loop that emits the same name twice fails at boot,
  # not silently.
  #
  # UPGRADE: earlier releases adopted a matching account unconditionally and let
  # role_mapping grant admin freely. With the defaults, users who relied on
  # adoption start failing SSO with oidc_link_not_allowed (bind them with the
  # non_admin pass above), and providers that granted admin stop until you set
  # allow_admin: true. See README "Single sign-on (OIDC)".
  #
  # auth:
  #   oidc:
  #     - name: keycloak
  #       issuer: https://sso.example.com/realms/main
  #       client_id: streamline
  #       # Mount the secret via secretFiles below rather than inlining it.
  #       client_secret_file: /etc/streamline/secrets/oidc-client-secret
  #       email_linking: disabled
  #       allow_admin: false
  #       # role_claim takes a dotted path into nested claims.
  #       role_claim: realm_access.roles
  #       role_mapping:
  #         streamline-admins: admin
  #         streamline-users: member

# Rendered into a Secret, mounted via envFrom with STREAMLINE_ prefix preserved
# (koanf STREAMLINE_* env overrides file config). Good for scalar secrets;
# array-nested secrets (oidc/indexers/download_clients) need secretFiles below.
secrets: {}
# Example keys (uppercase = env var):
#   STREAMLINE_METADATA__TMDB_API_KEY: "..."
#   STREAMLINE_AUTH__SESSION_SECRET: "..."

# Mount an existing (SOPS-managed) k8s Secret as files. Each Secret key becomes
# a file under mountPath; reference it from config via a *_file path, e.g.
#   config.indexers[].api_key_file: /etc/streamline/secrets/prowlarr-key
# Keeps secret values out of the ConfigMap while config stays declarative.
secretFiles:
  enabled: false
  existingSecret: "" # name of a pre-created Secret (its keys become files)
  mountPath: /etc/streamline/secrets

# OIDC redirect_uri is derived per-request from the host you connect on, so
# multi-domain SSO works without config — just register each domain's
# /auth/oidc/<name>/callback at the IdP. STREAMLINE_PUBLIC_URL only sets the
# canonical base for invite links (cosmetic); otherwise they fall back to
# http://<host>:<port>. Set it here when you want absolute invite URLs:
#   extraEnv:
#     - name: STREAMLINE_PUBLIC_URL
#       value: https://streamline.example.com
extraEnv: []

library:
  # Default: ONE volume mounted once. Hardlink-safe (single filesystem), so
  # config.library.import_mode "hardlink" works out of the box. The chart points
  # config.library at conventional subdirs of this mount:
  #   movie_path=<mountPath>/media/movies, series_path=<mountPath>/media/series,
  #   download_path=<mountPath>/downloads.
  # Want a different layout? Set config.library.{movie,series,download}_path
  # explicitly above and the chart leaves it as-is.
  shared:
    enabled: true
    existingClaim: "" # empty = create the PVC below
    mountPath: /srv
    size: 50Gi
    storageClass: "" # empty = cluster default
    accessMode: ReadWriteOnce
  # Alternative: separate media + downloads volumes. Two filesystems can't
  # hardlink across each other, so set config.library.import_mode to "copy"/"move"
  # when using these. Disable shared above before enabling either.
  media:
    enabled: false
    mountPath: /media
    existingClaim: ""
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  downloads:
    enabled: false
    mountPath: /downloads
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Optional local subchart: Alloy + VictoriaMetrics/Logs/Traces + Grafana.
observability:
  enabled: false

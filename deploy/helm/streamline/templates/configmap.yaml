apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streamline.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamline.labels" . | nindent 4 }}
data:
  config.yaml: |
{{- $cfg := deepCopy .Values.config }}
{{- $_ := set $cfg "otel" (include "streamline.otelConfig" . | fromYaml) }}
{{- if .Values.library.shared.enabled }}
{{- $mount := .Values.library.shared.mountPath }}
{{- $lib := $cfg.library | default dict }}
{{- $_ = set $lib "movie_path" (default (printf "%s/media/movies" $mount) $lib.movie_path) }}
{{- $_ = set $lib "series_path" (default (printf "%s/media/series" $mount) $lib.series_path) }}
{{- $_ = set $lib "download_path" (default (printf "%s/downloads" $mount) $lib.download_path) }}
{{- $_ = set $lib "music_path" (default (printf "%s/media/music" $mount) $lib.music_path) }}
{{- $_ = set $lib "ebook_path" (default (printf "%s/media/books" $mount) $lib.ebook_path) }}
{{- $_ = set $lib "audiobook_path" (default (printf "%s/media/audiobooks" $mount) $lib.audiobook_path) }}
{{- $_ = set $cfg "library" $lib }}
{{- else if .Values.library.media.enabled }}
{{- /* Movies and series already land on the media volume through the binary
       defaults (/media/movies, /media/series). Without this, music and books
       would stay on the persistence volume, /data/music and friends. */}}
{{- $mount := .Values.library.media.mountPath }}
{{- $lib := $cfg.library | default dict }}
{{- $_ = set $lib "music_path" (default (printf "%s/music" $mount) $lib.music_path) }}
{{- $_ = set $lib "ebook_path" (default (printf "%s/books" $mount) $lib.ebook_path) }}
{{- $_ = set $lib "audiobook_path" (default (printf "%s/audiobooks" $mount) $lib.audiobook_path) }}
{{- $_ = set $cfg "library" $lib }}
{{- end }}
{{ toYaml $cfg | indent 4 }}

version: "3"

tasks:
  unit:
    desc: Run unit tests only
    cmd: go tool ginkgo run -r --keep-going --label-filter="unit{{with .LABEL_FILTER}} &&
      {{.}}{{end}}" {{.CLI_ARGS}}

  integration:
    desc: Run integration tests
    cmd: go tool ginkgo run -r --keep-going --label-filter="integration{{with .LABEL_FILTER}} &&
      {{.}}{{end}}" {{.CLI_ARGS}}

  e2e:
    desc: Run hermetic e2e tests (API + web; container-backed specs excluded)
    deps: [":build:js", ":build:css"]
    cmd: go tool ginkgo run -r --keep-going --label-filter="e2e && !containers{{with
      .LABEL_FILTER}} && {{.}}{{end}}" --timeout=1m15s {{.CLI_ARGS}}

  e2e:containers:
    desc: Run container-backed e2e tests (needs Docker)
    deps: [":build:js", ":build:css"]
    env:
      STREAMLINE_E2E_CONTAINERS: "1"
    cmd: go tool ginkgo run -r --keep-going --label-filter="e2e && containers{{with
      .LABEL_FILTER}} && {{.}}{{end}}" --timeout=5m {{.CLI_ARGS}}

  coverage:
    desc: Run unit + integration tests with coverage report (e2e excluded, generated code filtered)
    cmds:
      - mkdir -p /tmp/streamline
      - go tool ginkgo run -r --keep-going --label-filter="!e2e"
        --coverprofile=coverage.raw.out --output-dir=/tmp/streamline
        --coverpkg=github.com/datahearth/streamline/...
        {{.CLI_ARGS}}
      - head -n 1 /tmp/streamline/coverage.raw.out > /tmp/streamline/coverage.out
      - tail -n +2 /tmp/streamline/coverage.raw.out | grep -Ev -e '/ent/' -e '/mocks/' -e 'internal/server/restapi/gen\.go' >> /tmp/streamline/coverage.out
      - go tool cover -func=/tmp/streamline/coverage.out
      - go tool cover -html=/tmp/streamline/coverage.out
        -o coverage.html

  default:
    desc: Run entire test suite
    cmd: go tool ginkgo run -r --keep-going {{.CLI_ARGS}}


version: "3"

vars:
  # ginkgo builds every suite it is pointed at while it runs them, skipped or
  # not, inside --timeout. Over the whole tree that is some 50 test binaries
  # with no e2e spec, and building them starves the e2e suites of disk and CPU
  # until requests and browser clicks hit their own timeouts.
  E2E_PACKAGES:
    sh: grep -rl --include='*_test.go' 'Label(.*"e2e"' cmd e2e internal |
      xargs -n1 dirname | sort -u | sed 's|^|./|' | tr '\n' ' '

tasks:
  unit:
    desc: Run unit tests only
    cmd: go tool ginkgo run -r --keep-going --label-filter="unit{{with .LABEL_FILTER}} &&
      {{.}}{{end}}" {{.CLI_ARGS}}

  integration:
    desc: Run integration tests
    cmd: go tool ginkgo run -r --keep-going --label-filter="integration{{with .LABEL_FILTER}} &&
      {{.}}{{end}}" {{.CLI_ARGS}}

  e2e:
    desc: Run hermetic e2e tests (API + web; container-backed specs excluded)
    deps: [":build:js", ":build:css"]
    # The timeout counts the build. E2E_TIMEOUT raises it where the Go build
    # cache can be cold, which CI's is on a cache miss.
    cmd: go tool ginkgo run -r --keep-going --label-filter="e2e && !containers{{with
      .LABEL_FILTER}} && {{.}}{{end}}" --timeout={{.E2E_TIMEOUT | default "1m15s"}} {{.CLI_ARGS | default .E2E_PACKAGES}}

  e2e:containers:
    desc: Run container-backed e2e tests (needs Docker)
    deps: [":build:js", ":build:css"]
    env:
      STREAMLINE_E2E_CONTAINERS: "1"
    cmd: go tool ginkgo run -r --keep-going --label-filter="e2e && containers{{with
      .LABEL_FILTER}} && {{.}}{{end}}" --timeout=5m {{.CLI_ARGS}}

  coverage:
    desc: Run unit + integration tests with coverage report (e2e excluded, generated code filtered)
    cmds:
      - mkdir -p /tmp/streamline
      - go tool ginkgo run -r --keep-going --label-filter="!e2e"
        --coverprofile=coverage.raw.out --output-dir=/tmp/streamline
        --coverpkg=github.com/datahearth/streamline/...
        {{.CLI_ARGS}}
      - head -n 1 /tmp/streamline/coverage.raw.out > /tmp/streamline/coverage.out
      - tail -n +2 /tmp/streamline/coverage.raw.out | grep -Ev -e '/ent/' -e '/mocks/' -e 'internal/server/restapi/gen\.go' >> /tmp/streamline/coverage.out
      - go tool cover -func=/tmp/streamline/coverage.out
      - go tool cover -html=/tmp/streamline/coverage.out
        -o coverage.html

  default:
    desc: Run entire test suite
    # The browser specs and the embedded-asset specs test the built bundles,
    # which are gitignored, so a checkout's copy can predate its web/app.
    # Both builds are fingerprinted and skip when their sources are unchanged.
    deps: [":build:js", ":build:css"]
    # The e2e specs go first and alone: ginkgo starts with cmd/ and e2e/, so in
    # one run they would sit in the middle of the whole tree's builds. The second
    # run still happens when the first fails, so one report covers everything.
    # Task runs a cmd under errexit, so each exit status is caught with `||`:
    # a bare `e2e=$?` on the next line is never reached after a failure.
    cmd: |
      e2e=0
      go tool ginkgo run -r --keep-going --label-filter=e2e {{with .JUNIT_DIR}}--junit-report={{.}}/junit-e2e.xml{{end}} {{.CLI_ARGS}} {{.E2E_PACKAGES}} || e2e=$?
      rest=0
      go tool ginkgo run -r --keep-going --label-filter='!e2e' {{with .JUNIT_DIR}}--junit-report={{.}}/junit-rest.xml{{end}} {{.CLI_ARGS}} || rest=$?
      exit $((e2e | rest))


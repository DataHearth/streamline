version: "2"

# Defaults cap the report at 3 findings per message text and 50 per linter,
# which silently hides the tail: a repo-wide gosec run reported 38 issues under
# the caps and 306 without them. A truncated report reads as a short todo list
# and is not one — fix the head, and CI fails again at findings it never showed.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofumpt
    - golines

  exclusions:
    generated: lax

  settings:
    golines:
      max-len: 85

linters:
  default: standard

  enable:
    - unparam
    - unconvert
    - modernize
    - prealloc
    - ginkgolinter
    - sloglint
    - spancheck
    - errorlint
    - bodyclose
    - gosec

  settings:
    # Scoped to G112 (Slowloris): an http.Server built without
    # ReadHeaderTimeout. The rest of gosec's rule set is not enabled here.
    gosec:
      includes:
        - G112
    unparam:
      check-exported: true
    sloglint:
      no-mixed-args: true
      kv-only: true
      context: all

  exclusions:
    generated: lax
    rules:
      # gosec in test code, scoped to the fixture-shaped rule classes — not a
      # blanket exclusion, so the rest of gosec still runs over tests. The
      # seeded e2e admin password (G101), 0644/0755 fixture files and dirs
      # (G301/G306), a chmod whose whole point is to provoke a permission
      # error (G302), reads of paths assembled under TempDir (G304), math/rand
      # for picking a listen port (G404), crypto/sha1 in the torznab fake
      # (G401/G505 — BitTorrent defines piece hashes as SHA-1), cookies built
      # as request fixtures (G124), and discarded errors that errcheck already
      # governs (G104) are each the test doing its job.
      - linters:
          - gosec
        path: (_test\.go$|^e2e/|^internal/testutil/)
        text: "G(101|104|124|301|302|304|306|401|404|505)"
      - linters:
          - errcheck
        source: .*\.Close\(\)
      # gosec's unhandled-error rule only: a different-rule finding (a G304
      # open, a G204 exec) on a line that happens to also match one of these
      # sources must still surface.
      - linters:
          - gosec
        source: .*\.Close\(\)
        text: "G104"
      - linters:
          - errcheck
        source: os\.Remove\(.*\)
        path: .*_test.go$
      - linters:
          - errcheck
        source: os\.(Setenv|Unsetenv)\(.*\)
        path: .*_test.go$
      # otelx.RecordSpanError returns the wrapped error for inline use
      # (return ..., otelx.RecordSpanError(span, err)). Discard is fine
      # when the caller logs and continues instead of returning.
      - linters:
          - errcheck
        source: otelx\.RecordSpanError\(.*\)
      - linters:
          - gosec
        source: otelx\.RecordSpanError\(.*\)
        text: "G104"
      # tx.Rollback() inside db.Tx helper: the outer fn error is the one
      # we care about; a rollback error is not actionable and would shadow it.
      - linters:
          - errcheck
        source: tx\.Rollback\(\)
      - linters:
          - gosec
        source: tx\.Rollback\(\)
        text: "G104"
      # testutil package is test-only infrastructure; dot imports of
      # ginkgo/gomega are idiomatic for Ginkgo test helpers.
      - linters:
          - staticcheck
        text: "ST1001"
        path: internal/testutil/
      - linters:
          - staticcheck
        text: "ST1001"
        path: e2e/
